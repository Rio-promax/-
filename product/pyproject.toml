[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multisource-knowledge-core"
version = "0.2.0"
description = "Local-first domain and archive foundation for a multi-source content knowledge base."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=42,<46",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "sqlite-vec>=0.1.9,<0.2",
  "uvicorn>=0.34,<1.0",
  "qrcode>=8.0,<9.0",
  "yt-dlp>=2025.1,<2027",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.9,<3.0",
  "pytest>=8.0,<9.0",
]
local-asr = [
  "faster-whisper>=1.1,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/services/core/app"]

[tool.pytest.ini_options]
testpaths = ["src/services/core/tests"]
pythonpath = ["src/services/core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
